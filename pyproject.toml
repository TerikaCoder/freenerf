[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freenerf"
version = "0.2.0"
description = "Multi-provider autonomous AI coding agent for Termux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "textual>=1.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
freenerf = "freenerf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
